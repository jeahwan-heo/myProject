<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아재개그 맞추기 🥸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Gothic:wght@400;700;800&display=swap');

  :root {
    --yellow: #FFE566;
    --orange: #FF6B35;
    --dark: #1A1A2E;
    --mid: #2D2D44;
    --cream: #FFF9E6;
    --green: #00C897;
    --red: #FF4D6D;
    --text: #1A1A2E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    font-family: 'Nanum Gothic', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* 배경 패턴 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 20% 20%, #2D2D6E22 0%, transparent 50%),
                      radial-gradient(circle at 80% 80%, #FF6B3511 0%, transparent 50%);
    pointer-events: none;
  }

  .game-wrap {
    width: 100%;
    max-width: 520px;
    position: relative;
  }

  /* 헤더 */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header-badge {
    display: inline-block;
    background: var(--yellow);
    color: var(--dark);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    padding: 4px 14px;
    border-radius: 99px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .header h1 {
    font-family: 'Gaegu', cursive;
    font-size: 42px;
    font-weight: 700;
    color: var(--yellow);
    line-height: 1.1;
    text-shadow: 4px 4px 0 #00000033;
  }

  .header .sub {
    color: #ffffff66;
    font-size: 13px;
    margin-top: 6px;
  }

  /* 점수판 */
  .scoreboard {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .score-card {
    flex: 1;
    background: var(--mid);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    border: 1px solid #ffffff0f;
  }

  .score-label {
    font-size: 10px;
    color: #ffffff55;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .score-num {
    font-size: 26px;
    font-weight: 800;
    color: var(--yellow);
    font-family: 'Gaegu', cursive;
  }

  .score-num.green { color: var(--green); }
  .score-num.red { color: var(--red); }

  /* 진행 바 */
  .progress-wrap {
    margin-bottom: 20px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #ffffff44;
    margin-bottom: 6px;
  }

  .progress-bar {
    height: 6px;
    background: #ffffff11;
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--yellow), var(--orange));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* 카드 */
  .card {
    background: var(--cream);
    border-radius: 24px;
    padding: 32px 28px 28px;
    position: relative;
    border: 3px solid #ffffff10;
    box-shadow: 0 20px 60px #00000055, 0 0 0 1px #ffffff08;
    min-height: 280px;
    display: flex;
    flex-direction: column;
  }

  .card-num {
    position: absolute;
    top: -14px;
    left: 28px;
    background: var(--orange);
    color: white;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 99px;
    letter-spacing: 1px;
  }

  .question-icon {
    font-size: 40px;
    margin-bottom: 16px;
    text-align: center;
    filter: drop-shadow(0 4px 8px #00000022);
    animation: wobble 3s ease-in-out infinite;
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  .question-text {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    line-height: 1.5;
    margin-bottom: 24px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 정답 입력 */
  .input-area {
    position: relative;
    margin-bottom: 14px;
  }

  .answer-input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    border: 2.5px solid #1A1A2E22;
    font-size: 18px;
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    color: var(--text);
    background: white;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    text-align: center;
  }

  .answer-input:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 4px #FF6B3522;
  }

  .answer-input.correct {
    border-color: var(--green);
    background: #E8FFF7;
    box-shadow: 0 0 0 4px #00C89722;
  }

  .answer-input.wrong {
    border-color: var(--red);
    background: #FFF0F3;
    box-shadow: 0 0 0 4px #FF4D6D22;
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
  }

  /* 정답 공개 박스 */
  .reveal-box {
    display: none;
    text-align: center;
    padding: 16px;
    border-radius: 14px;
    margin-bottom: 14px;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .reveal-box.correct-reveal {
    background: #E8FFF7;
    border: 2px solid var(--green);
  }

  .reveal-box.wrong-reveal {
    background: #FFF0F3;
    border: 2px solid #FF4D6D44;
  }

  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .reveal-emoji { font-size: 28px; margin-bottom: 4px; }

  .reveal-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .reveal-answer {
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }

  .reveal-comment {
    font-size: 12px;
    color: #1A1A2E88;
    margin-top: 4px;
    font-style: italic;
  }

  /* 버튼들 */
  .btn-row {
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-size: 15px;
    font-weight: 800;
    font-family: 'Nanum Gothic', sans-serif;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: -0.3px;
  }

  .btn:active { transform: scale(0.97); }

  .btn-submit {
    background: var(--orange);
    color: white;
    box-shadow: 0 6px 20px #FF6B3555;
  }

  .btn-submit:hover { box-shadow: 0 8px 28px #FF6B3577; transform: translateY(-1px); }

  .btn-hint {
    background: var(--dark);
    color: var(--yellow);
    flex: 0 0 auto;
    padding: 14px 18px;
    font-size: 13px;
  }

  .btn-next {
    background: var(--green);
    color: white;
    box-shadow: 0 6px 20px #00C89755;
  }

  .btn-next:hover { box-shadow: 0 8px 28px #00C89777; transform: translateY(-1px); }

  /* 힌트 */
  .hint-box {
    display: none;
    background: #FFF3CD;
    border: 1.5px solid #FFE566;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    color: #7A5C00;
    text-align: center;
    margin-bottom: 12px;
    animation: popIn 0.3s ease;
  }

  /* 결과 화면 */
  .result-screen {
    display: none;
    text-align: center;
    padding: 20px 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
  }

  .result-trophy { font-size: 64px; margin-bottom: 16px; animation: bounce 1s ease infinite alternate; }

  @keyframes bounce {
    from { transform: translateY(0) scale(1); }
    to { transform: translateY(-10px) scale(1.05); }
  }

  .result-title {
    font-family: 'Gaegu', cursive;
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }

  .result-score {
    font-size: 18px;
    color: var(--text);
    margin-bottom: 20px;
  }

  .result-score span {
    font-family: 'Gaegu', cursive;
    font-size: 36px;
    font-weight: 700;
    color: var(--orange);
  }

  .result-grade {
    display: inline-block;
    padding: 8px 24px;
    border-radius: 99px;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 20px;
  }

  .result-comment {
    font-size: 14px;
    color: #1A1A2E77;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .btn-restart {
    background: var(--dark);
    color: var(--yellow);
    border: none;
    padding: 14px 32px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    font-family: 'Nanum Gothic', sans-serif;
    cursor: pointer;
    box-shadow: 0 6px 20px #00000044;
    transition: transform 0.15s;
  }

  .btn-restart:hover { transform: translateY(-2px); }
  .btn-restart:active { transform: scale(0.97); }

  /* 파티클 효과 */
  .particle {
    position: fixed;
    pointer-events: none;
    font-size: 24px;
    animation: particle-fly 1.2s ease forwards;
    z-index: 999;
  }

  @keyframes particle-fly {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-120px) scale(0.5) rotate(360deg); }
  }

  /* 카드 등장 애니 */
  .card { animation: cardIn 0.4s cubic-bezier(0.34, 1.4, 0.64, 1); }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 화면 아래 크레딧 */
  .credit {
    margin-top: 20px;
    font-size: 11px;
    color: #ffffff22;
    text-align: center;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="header">
    <div class="header-badge">🥸 EASTER EGG</div>
    <h1>아재개그<br>맞추기</h1>
    <p class="sub">팀원들이 인간임을 증명해보시오</p>
  </div>

  <!-- 점수판 -->
  <div class="scoreboard">
    <div class="score-card">
      <div class="score-label">문제</div>
      <div class="score-num" id="q-num">1</div>
    </div>
    <div class="score-card">
      <div class="score-label">정답</div>
      <div class="score-num green" id="correct-cnt">0</div>
    </div>
    <div class="score-card">
      <div class="score-label">틀림</div>
      <div class="score-num red" id="wrong-cnt">0</div>
    </div>
    <div class="score-card">
      <div class="score-label">힌트 사용</div>
      <div class="score-num" id="hint-cnt" style="color:#FFE566">0</div>
    </div>
  </div>

  <!-- 진행 바 -->
  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-text">1 / 12</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="prog-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- 게임 카드 -->
  <div class="card" id="game-card">
    <div class="card-num" id="card-num">Q.1</div>

    <!-- 게임 화면 -->
    <div id="game-screen">
      <div class="question-icon" id="q-icon">🤔</div>
      <div class="question-text" id="q-text">로딩 중...</div>

      <div class="hint-box" id="hint-box" role="alert"></div>

      <div class="reveal-box" id="reveal-box">
        <div class="reveal-emoji" id="reveal-emoji"></div>
        <div class="reveal-title" id="reveal-title"></div>
        <div class="reveal-answer" id="reveal-answer"></div>
        <div class="reveal-comment" id="reveal-comment"></div>
      </div>

      <div class="input-area" id="input-area">
        <input class="answer-input" id="answer-input" type="text" placeholder="정답을 입력하세요..." autocomplete="off" />
      </div>

      <div class="btn-row" id="btn-before">
        <button class="btn btn-hint" id="btn-hint" onclick="showHint()">💡 힌트</button>
        <button class="btn btn-submit" id="btn-submit" onclick="checkAnswer()">정답 제출 →</button>
      </div>

      <div class="btn-row" id="btn-after" style="display:none">
        <button class="btn btn-next" onclick="nextQuestion()">다음 문제 →</button>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div class="result-screen" id="result-screen">
      <div class="result-trophy" id="result-trophy">🏆</div>
      <div class="result-title" id="result-title">아재 인증 완료!</div>
      <div class="result-score">
        <span id="final-score">0</span> / 12 정답
      </div>
      <div class="result-grade" id="result-grade"></div>
      <div class="result-comment" id="result-comment"></div>
      <button class="btn-restart" onclick="restartGame()">🔄 다시 도전하기</button>
    </div>
  </div>

  <div class="credit">IS팀 이스터에그 v1.0 · 팀원들이 너무 심심할 때 발견하도록 숨겨두세요</div>
</div>

<script>
const jokes = [
  { icon:'🐄', q:'소가 웃으면?', a:'우유', hint:'소가 내는 것', comment:'우유... 웃기죠? ㅋ' },
  { icon:'🌧️', q:'비가 오는데 쌀이 자라면?', a:'우박', hint:'비 + 쌀 = ?', comment:'우(비) + 박(쌀 박) 이라구요 😇' },
  { icon:'🐸', q:'개구리가 뛰면?', a:'개굴개굴', hint:'개구리 소리', comment:'개구리 + 굴러서 = 개굴개굴 🐸' },
  { icon:'🍎', q:'사과가 웃으면?', a:'풋사과', hint:'덜 익은 사과', comment:'풋(웃음소리) + 사과 = 풋사과 😂' },
  { icon:'🌍', q:'지구가 아프면 어디를 가나요?', a:'지구병원', hint:'지구 + 병원', comment:'지구... 병원... 지구병원! 🌍💊' },
  { icon:'🐶', q:'개가 한 마리면?', a:'개인기', hint:'혼자 하는 것', comment:'개 1마리 = 개인기 🐕🎤' },
  { icon:'🔢', q:'1 더하기 1이 뭐냐고 생선이 말하면?', a:'이이', hint:'숫자 2를 생선처럼 읽으면?', comment:'"이이(2+2)잖아요?" 아니고 "이이~" (물고기 소리) 🐟' },
  { icon:'🐱', q:'고양이가 가장 좋아하는 영화 장르는?', a:'로맨스', hint:'고양이 + 로맨스... 아니 다른 것', comment:'냥(낭)만 영화 = 로맨스! 냥만주의 😸' },
  { icon:'🏋️', q:'헬스장에서 운동을 안 하면?', a:'헬스포기', hint:'헬스 + ??', comment:'헬스 + 포기 = 헬스포기 (저도요) 💪' },
  { icon:'🍦', q:'아이스크림이 슬프면?', a:'샤베트', hint:'샤베 + 트', comment:'샤베(슬퍼) + 트(트리) = 샤베트 😢' },
  { icon:'🦷', q:'치과 의사가 제일 좋아하는 노래는?', a:'이를 악물고', hint:'이 + 악물고', comment:'"이를 악물고" 버텨봐~ 🎵🦷' },
  { icon:'🐠', q:'물고기가 수영을 못하면?', a:'금붕어', hint:'금 + 붕어', comment:'금(禁)붕어 = 수영 금지된 붕어 🚫🐟' },
];

let current = 0;
let correctCount = 0;
let wrongCount = 0;
let hintUsed = 0;
let hintShown = false;
let answered = false;
let shuffled = [];

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function restartGame() {
  current = 0; correctCount = 0; wrongCount = 0; hintUsed = 0;
  shuffled = shuffle(jokes);
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('result-screen').style.flexDirection = '';
  document.getElementById('game-screen').style.display = 'block';
  updateScoreboard();
  loadQuestion();
}

function loadQuestion() {
  if (current >= shuffled.length) { showResult(); return; }
  const j = shuffled[current];
  hintShown = false;
  answered = false;

  document.getElementById('card-num').textContent = `Q.${current + 1}`;
  document.getElementById('q-icon').textContent = j.icon;
  document.getElementById('q-text').textContent = j.q;

  const inp = document.getElementById('answer-input');
  inp.value = '';
  inp.className = 'answer-input';
  inp.disabled = false;
  inp.focus();

  document.getElementById('hint-box').style.display = 'none';
  document.getElementById('reveal-box').style.display = 'none';
  document.getElementById('input-area').style.display = 'block';
  document.getElementById('btn-before').style.display = 'flex';
  document.getElementById('btn-after').style.display = 'none';
  document.getElementById('btn-hint').disabled = false;
  document.getElementById('btn-submit').disabled = false;

  updateProgress();
  // 카드 재등장 애니메이션
  const card = document.getElementById('game-card');
  card.style.animation = 'none';
  requestAnimationFrame(() => { card.style.animation = 'cardIn 0.4s cubic-bezier(0.34, 1.4, 0.64, 1)'; });
}

function normalize(s) {
  return s.trim().replace(/\s+/g, '').toLowerCase();
}

function checkAnswer() {
  if (answered) return;
  const j = shuffled[current];
  const val = document.getElementById('answer-input').value;
  if (!val.trim()) return;

  answered = true;
  const inp = document.getElementById('answer-input');
  inp.disabled = true;
  document.getElementById('btn-before').style.display = 'none';
  document.getElementById('btn-after').style.display = 'flex';
  document.getElementById('input-area').style.display = 'none';

  const isCorrect = normalize(val) === normalize(j.a);

  const rb = document.getElementById('reveal-box');
  rb.style.display = 'block';
  rb.className = 'reveal-box ' + (isCorrect ? 'correct-reveal' : 'wrong-reveal');
  document.getElementById('reveal-emoji').textContent = isCorrect ? '🎉' : '😅';
  document.getElementById('reveal-title').textContent = isCorrect ? '정답입니다!' : `아쉽! 정답은...`;
  document.getElementById('reveal-title').style.color = isCorrect ? '#00A37A' : '#CC2244';
  document.getElementById('reveal-answer').textContent = j.a;
  document.getElementById('reveal-comment').textContent = j.comment;

  if (isCorrect) {
    correctCount++;
    spawnParticles(['🎉','⭐','✨','🌟'], 8);
  } else {
    wrongCount++;
  }
  updateScoreboard();
}

function showHint() {
  if (hintShown || answered) return;
  hintShown = true;
  hintUsed++;
  const j = shuffled[current];
  const hb = document.getElementById('hint-box');
  hb.textContent = '💡 힌트: ' + j.hint;
  hb.style.display = 'block';
  document.getElementById('hint-cnt').textContent = hintUsed;
  document.getElementById('btn-hint').disabled = true;
  document.getElementById('btn-hint').style.opacity = '0.4';
}

function nextQuestion() {
  current++;
  loadQuestion();
}

function updateScoreboard() {
  document.getElementById('q-num').textContent = current + 1;
  document.getElementById('correct-cnt').textContent = correctCount;
  document.getElementById('wrong-cnt').textContent = wrongCount;
  document.getElementById('hint-cnt').textContent = hintUsed;
}

function updateProgress() {
  const pct = Math.round((current / shuffled.length) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = `${current + 1} / ${shuffled.length}`;
  document.getElementById('prog-pct').textContent = pct + '%';
}

function showResult() {
  document.getElementById('game-screen').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'flex';
  rs.style.flexDirection = 'column';

  const total = shuffled.length;
  const pct = Math.round((correctCount / total) * 100);

  let trophy, title, grade, gradeColor, comment;

  if (pct >= 90) {
    trophy = '👑'; title = '아재 마스터';
    grade = 'S급 아재'; gradeColor = '#FFD700';
    comment = '당신은 이미 아재입니다.\n팀 내 공식 아재 포지션을 노리세요.';
  } else if (pct >= 70) {
    trophy = '🥇'; title = '우수 아재 후보';
    grade = 'A급 아재'; gradeColor = '#FF6B35';
    comment = '꽤 하시는군요.\n조금만 더 연습하면 진짜 아재됩니다.';
  } else if (pct >= 50) {
    trophy = '🥈'; title = '중간은 갑니다';
    grade = 'B급 아재'; gradeColor = '#00C897';
    comment = '평범한 유머 감각의 소유자.\n아직 청년과 아재 사이 어딘가...';
  } else if (pct >= 30) {
    trophy = '🥉'; title = '아재와 거리가 있어요';
    grade = 'C급 아재'; gradeColor = '#9B9B9B';
    comment = '아재개그가 맞지 않는 정통 MZ세대.\n그것도 개성입니다 😎';
  } else {
    trophy = '🪴'; title = '당신은 MZ 그 자체';
    grade = 'Z급 아재'; gradeColor = '#FF4D6D';
    comment = '"아재개그요? 그게 뭔가요?"\n— 당신이 한 말 (아마도)';
  }

  document.getElementById('result-trophy').textContent = trophy;
  document.getElementById('result-title').textContent = title;
  document.getElementById('final-score').textContent = correctCount;
  document.getElementById('result-comment').textContent = comment;

  const gradeEl = document.getElementById('result-grade');
  gradeEl.textContent = grade;
  gradeEl.style.background = gradeColor + '22';
  gradeEl.style.color = gradeColor;
  gradeEl.style.border = `1.5px solid ${gradeColor}55`;

  spawnParticles(['🎊','🎉','✨','⭐','🥳'], 16);
}

function spawnParticles(list, n) {
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'particle';
      el.textContent = list[Math.floor(Math.random() * list.length)];
      el.style.left = (20 + Math.random() * 60) + 'vw';
      el.style.top = (40 + Math.random() * 20) + 'vh';
      el.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    }, i * 80);
  }
}

// Enter 키 제출
document.getElementById('answer-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') checkAnswer();
});

// 초기화
shuffled = shuffle(jokes);
updateScoreboard();
loadQuestion();
</script>
